{% extends "base.html" %}
{% block title %}Reservar Bancada{% endblock %}
{% block conteudo %}
<h2>📅 Reservar Bancada ou Mesas</h2>
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <form action="{{ url_for('client.reservar_bancada') }}" method="POST">
    <div class="form-group">
      <label>Selecione a Bancada</label>
      <select name="bancada_id" required>
        {% for b in bancadas %}
          <option value="{{ b.id }}">{{ b.nome }} (Capacidade: {{ b.capacidade_mesas }} mesas)</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Tipo de Reserva</label>
      <select name="tipo_reserva" id="tipoReserva" onchange="toggleMesas()" required>
        <option value="inteira">Bancada Inteira (Todas as mesas)</option>
        <option value="parcial">Quantidade Específica de Mesas</option>
      </select>
    </div>

    <div class="form-group" id="grupoQtdMesas" style="display: none;">
      <label>Número de Mesas Desejadas</label>
      <input type="number" name="quantidade_mesas" min="1" value="1">
    </div>

    <div class="form-group">
      <label>Data da Reserva</label>
      <input type="date" name="data_reserva" required>
    </div>

    <div class="form-group">
      <label>Horário de Início</label>
      <input type="time" name="hora_inicio" required>
    </div>

    <div class="form-group">
      <label>Horário de Término (Limite da Reserva)</label>
      <input type="time" name="hora_fim" required>
    </div>

    <button type="submit" class="btn">Confirmar Reserva</button>
  </form>
</div>

<script>
  function toggleMesas() {
    const tipo = document.getElementById('tipoReserva').value;
    const grupo = document.getElementById('grupoQtdMesas');
    if (tipo === 'parcial') {
      grupo.style.display = 'block';
    } else {
      grupo.style.display = 'none';
    }
  }
</script>
{% endblock %}
