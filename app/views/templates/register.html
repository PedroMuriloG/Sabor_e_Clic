{% extends "base.html" %}

{% block title %}Sabor & Clic - Cadastro de Cliente{% endblock %}

{% block conteudo %}
<h2>🍓 Cadastro de Novo Cliente</h2>

<div class="card" style="max-width: 400px; margin: 0 auto;">
  <form action="{{ url_for('auth.register') }}" method="POST">
    <div class="form-group">
      <label>Nome Completo</label>
      <input type="text" name="nome" required placeholder="ex: Maria Silva">
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" name="email" required placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label>Data de Nascimento</label>
      <input type="date" name="data_nascimento" required>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="password" required placeholder="Sua senha">
    </div>

    <button type="submit" class="btn">Criar Conta</button>
  </form>
  
  <p style="margin-top: 15px; text-align: center; font-size: 0.85rem;">
    Já tem uma conta? <a href="{{ url_for('auth.login') }}" style="color: var(--burgundy); font-weight: bold;">Faça login aqui</a>
  </p>
</div>
{% endblock %}
