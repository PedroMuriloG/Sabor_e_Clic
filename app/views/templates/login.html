{% extends "base.html" %}

{% block title %}Sabor & Clic - Login{% endblock %}

{% block conteudo %}
<h2>🔐 Acesso ao Sistema</h2>

<div class="card" style="max-width: 400px; margin: 0 auto;">
  <form action="{{ url_for('auth.login') }}" method="POST">
    <div class="form-group">
      <label for="username">Nome de Usuário / E-mail</label>
      <input type="text" id="username" name="username" placeholder="ex: seu nome" required>
    </div>
    
    <div class="form-group">
      <label for="password">Palavra-passe / Senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>
    
    <button type="submit" class="btn" style="width: 100%;">Entrar</button>
  </form>
  
  <p style="margin-top: 15px; text-align: center; font-size: 0.85rem;">
    Não tem uma conta de cliente? <a href="{{ url_for('auth.register') }}" style="color: var(--burgundy); font-weight: bold;">Cadastre-se aqui</a>
  </p>
</div>
{% endblock %}
